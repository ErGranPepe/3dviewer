name: refs-fetch
on:
  push:
    branches: [osm-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_refs.py
      - name: Publicar en la rama refs-out
        run: |
          cd refs && git init -q && git checkout -q -b refs-out && git add -A
          git -c user.name=ref-bot -c user.email=ref-bot@users.noreply.github.com commit -q -m "Fotos de referencia (Wikimedia Commons, solo consulta)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" refs-out
