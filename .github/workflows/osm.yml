name: assets-fetch
on:
  push:
    branches: [osm-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_assets.py
      - name: Publicar en la rama assets-out
        run: |
          cd out && git init -q && git checkout -q -b assets-out && git add -A
          git -c user.name=asset-bot -c user.email=asset-bot@users.noreply.github.com commit -q -m "Texturas y modelos CC0 (ambientCG, Poly Haven)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" assets-out
