name: tex-fetch
on:
  push:
    branches: [osm-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_tex.py
      - name: Publicar en la rama tex-out
        run: |
          cd tex && git init -q && git checkout -q -b tex-out && git add -A
          git -c user.name=tex-bot -c user.email=tex-bot@users.noreply.github.com commit -q -m "Texturas CC0 de ambientCG"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tex-out
