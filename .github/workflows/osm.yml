name: sat-fetch
on:
  push:
    branches: [osm-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_sat.py
      - name: Publicar en la rama sat-out
        run: |
          cd sat && git init -q && git checkout -q -b sat-out && git add -A
          git -c user.name=sat-bot -c user.email=sat-bot@users.noreply.github.com commit -q -m "Ortofotos con licencia abierta"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" sat-out
