name: bld-fetch
on:
  push:
    branches: [bld-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install overturemaps pyproj
      - run: BAGONLY=1 python3 tools/fetch_bld.py
      - run: git fetch -q origin bld-out && for f in $(git ls-tree --name-only origin/bld-out); do [ -f out/$f ] || git show origin/bld-out:$f > out/$f; done
      - name: Publicar en la rama bld-out
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b bld-out && git add -A
          git -c user.name=bld-bot -c user.email=bld-bot@users.noreply.github.com commit -q -m "Edificios de datos abiertos (Overture Maps, 3D BAG)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" bld-out
