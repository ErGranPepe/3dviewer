name: live-shots
on:
  push:
    branches: [live-shots]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./probe.sh | tee probe.txt
      - name: Publicar
        if: always()
        run: |
          mkdir out && cp probe.txt out/ && cd out && git init -q && git checkout -q -b live-probe-out && git add -A
          git -c user.name=shot-bot -c user.email=shot-bot@users.noreply.github.com commit -q -m probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" live-probe-out
